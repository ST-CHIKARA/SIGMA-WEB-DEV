<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start of CSS</title>
    <style>
        div,span{   /*This is what we call a selector*/                   
            color: purple; /*This is what we call a declaration*/
            background-color: pink;  
        }
        
    </style>
</head>
<body>
    <div>Today we will start learning CSS - I am a block element that takes up all the space</div>
    <span>This is very basic - I am a inline element that takes just that space that is needed</span>
</body>
</html>
