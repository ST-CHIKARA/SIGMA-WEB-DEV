<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and Outlines</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px #888888;
        }

        .text-element{text-shadow: 6px 8px 4px #ed0bc4;}
    </style>
</head>
<body>
    <div class="box">I am a box</div>
    <p class="text-element">Lorem ipsum dolor sit amet consectetur adipisicing elit. Ea consequatur dicta veritatis eligendi eius labore molestias nostrum possimus quibusdam asperiores provident quasi fugit, laudantium suscipit sunt odit nam commodi, quisquam itaque illum nesciunt error?</p>
</body>
</html>
