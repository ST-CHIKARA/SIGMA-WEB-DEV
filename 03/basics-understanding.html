<!-- HTML have tags mainly paired tags and self closing tags--> 

<!-- Tags like <html> </html> are what we call paired tags that contains the content within them--> 

<!-- Tags like <img src="" alt=""> are what we call self closing tags that dont need to be paired as the element of this tag only needs to be at a certain place at a specific spot like inserting an image--> 

<!-- Meta data is something what we define as data about data --> 

<!-- Phone Calls: The conversation is the data. The metadata is the phone number you called, the time the call started, and how long it lasted. --> 

<!-- Digital Photos: The image itself is the data. The metadata is the date you took it, the GPS location, and the type of phone you used --> 

<!-- Books: The story is the data. The metadata is the title, the author’s name, and the ISBN barcode on the back -->

<!-- Metadata exists to help machines (like Google or the computer) to understand and organize things that they can't "see" or "read" the way humans do --> 

<!-- Search: It helps Google find the website by looking at "keywords" in the code rather than reading every single sentence on the page --> 

<!-- Organization: It helps the computer sort files by "Date Modified" or "File Size." --> 

<!-- Display: It tells the browser things like, "Hey, this website should be zoomed in for mobile phones." --> 

<!-- To put it simply whatever is written inside <title> </title> can be considered as meta data while everything written inside <body> </body> can be considered as data -->  





<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- Tells the browser which alphabet and symbol to use-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Tells the browser how to fit a page on the phone screen-->
    <title>Document</title>
</head>
<body>
    
</body>
</html>
