<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>event bubbling</title>
    <style>
        .child {
            background-color: aqua;
            border: 2px solid black;
            padding: 14px;
            margin: 14px;
            cursor: pointer;
        }

        .childcontainer {
            background-color: blueviolet;
            padding: 14px;
            margin: 14px;
        }

        .container {
            background-color: red;
            padding: 14px;
            margin: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <section class="childcontainer">
            <div class="child">
                I am a child
            </div>
        </section>
    </div>
    <script>

        // When we designated these 3 events a thing was seen that when we click on the child a thing called eventbubbling happened where when we clicked on the child the alert happened but alerts of childcontainer as well as the alert of container also happened hence the term bubbling

        // and to stop that we can stop the propagation of the event by giving the e means event argument amd using that to stop the propagation

        document.querySelector(".child").addEventListener("click", (e) => {
            e.stopPropagation()
            alert("child was clicked")
        })

        document.querySelector(".childcontainer").addEventListener("click", (e) => {
            alert("childcontainer was clicked")
        })

        document.querySelector(".container").addEventListener("click", (e) => {
            alert("container was clicked")
        })

        function getRandomColor() {
            let val1 = Math.ceil(0 + Math.random() * 255);
            let val2 = Math.ceil(0 + Math.random() * 255);
            let val3 = Math.ceil(0 + Math.random() * 255);
            return `rgb(${val1}, ${val2}, ${val3})`
        }

        let a = setInterval(() => {
            document.querySelector(".childcontainer").style.background = getRandomColor()
        }, 1000);

        console.log(a)

    </script>
</body>

</html>
