<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img width="600"  src="chinook.jpg" alt="Chinook">

<br>

    <table>
        <caption>Employee details</caption>

        <thead>
            <!-- header content -->
             Header
        </thead>
        

        <tr> <!--table row-->
            <th>Name</th> <!--table heading-->
            <th>Age</th>
            <th>Designation</th>
        </tr>

        <tr>
            <td>ST</td> <!--table data-->
            <td>26</td>
            <td>Coder</td>
        </tr>

         <tr>
            <td>SN</td> 
            <td>26</td>
            <td>scientist</td>
        </tr>

         <tr>
            <td>SS</td>
            <td rowspan="2">26</td>
            <td rowspan="2">programmer</td>
        </tr>

         <tr>
            <td>SN</td>
        </tr>

        <tr>
            <td colspan="2">JD</td> 
            <td rowspan="2">scientist</td>
        </tr>

        <tr>
            <td colspan="2">JD</td> 
        </tr>

        <tfoot>
            <!-- footer content -->
             Footer
        </tfoot>
    </table>

<br>
    
    <ul type="square"> <!--Unordered list :- Displays items using bullets.Using type here to make bullet points in shape of square-->
        <li>ST</li>
        <li>SN</li>
        <li>UG</li>
    </ul>

<br>

     <ol type="I"> <!--ordered list :- Displays items in a numerical sequence, and supports various numbering styles like Arabic numerals, Roman numerals, and so on.We used type = I to make the numbers roman and if we didnt do it it would be just 123-->
        <li>ST</li>
        <li>SN</li>
        <li>UG</li>
    </ol>

<br>

    <dl> <!--definition list :- Organizes items in a format similar to a dictionary, with terms and their corresponding definitions-->
        <dt>HTML</dt>
        <dd>hyper text markup language</dd>

        <dt>CSS</dt>
        <dd>cascading style sheets</dd>

        <dt>JS</dt>
        <dd>javascript</dd>
    </dl>
</body>
</html>
