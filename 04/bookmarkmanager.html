<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
</head>
<body>
    <h1>My Bookmarks</h1>
    <h2>Primary bookmarks</h2>
    <p><a target="_blank" href="https://www.google.com">Open Google</a> <!--Use of anchor tag here to make links and use of attribute target to open link in a new tab everytime we click on it--></p>
    <p><a target="_blank" href="https://www.codewithharry.com">Open codewithharry</a></p>
    <p><a target="_blank" href="https://www.youtube.com">Open Youtube</a></p>
    <p><a target="_blank" href="https://www.novelfire.net">Open Novelfire</a></p>
    <h2>Secondary bookmarks</h2>
    <p><a target="_blank" href="https://www.grokipedia.com">Open grokipedia</a></p>
    <p><a target="_blank" href="https://www.wikipedia.org">Open Wikipedia</a></p>
</body>
</html>
