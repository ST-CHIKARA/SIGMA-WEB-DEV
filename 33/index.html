<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4:- CSS Multicolor website :- Create a multicolor website that can change color using css variables
    </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');

        * {
            padding: 0;
            margin: 0;
            font-family: "Poppins", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        :root{
            --primary-color:rgb(241, 42, 241);
            --text-color:white;
            --sec-color:purple;
        }

        body{
            background-color: var(--sec-color);
        }


        ul li {
            list-style: none;
            display: inline;
            padding: 30px;
            font-weight: bolder;
            color: var(--text-color);
        }

        nav {
            background-color: var(--primary-color);
            padding: 13px 0px;
            }
            

        
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>Pricing</li>
                <li>Resources</li>
                <li>About</li>
            </ul>
        </nav>
    </header>
</body>

</html>
