<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5:- Layout</title>
    <style>

        *{
            padding: 0;
            margin: 0;
        }

        header{
            position: sticky;
            top: 0;
        }

        nav{
            background-color: pink;
            height: 50px;
            
        }

        main{
            background-color: black;
            color: white;
            padding: 20px;
        }

        .container{
            background-color: green;
            margin: 20px 35px;
            /* height: 300px; */
            text-align: center;
            padding: 20px 33px;
        }

        .box1{
            background-color: palevioletred;
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0px 15px ;
        }


        .box2{
            background-color: blue;
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0px 15px ;
        }

        .text-box{
            padding: 30px;
            border: 2px solid white;
            margin: 50px 30vh;
            font-size: 2em;
            border-radius: 10px;
            text-align: center;
        }

        footer{
            height: 50px;
            background-color: bisque;
        }


        .orange-box{
            height: 32px;
            width: 32px;
            background: orange;
            position: fixed;
            bottom: 12px;
            right: 23px;
            border-radius: 60px;

        }
    </style>
</head>
<body>

    <header>
        <nav></nav>
    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="text-box">
            <p>Welcome to sigma webdev</p>
        </div>

        <div class="orange-box"></div>

    </main>


    <footer></footer>
</body>
</html>
