<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All about color properties</title>
    <style>
        h1{
            color: purple; /*Using color keywords*/
            /* color:#6709B5; Using Hex color code. This is a different shade of purple */
            /* color: rgb(103, 9, 181); Using rgb (red,green,blue)  */
            /* color: hsl(273, 91, 37); Using HSL (hue, saturation, lightness) */
            /* color: rgba(103, 9, 181, 0.8); Using rgba where a stand for alpha */
            
        }
    </style>
</head>
<body>
    <h1>Lets learn about colors</h1>
    <p>
        Colors can be represented in:
        <ol>
            <li>color keywords</li>
            <li>Hex color codes</li>
            <li>RGB</li>
            <li>RGBA</li>
            <li>HSL</li>
        </ol>
    </p>
</body>
</html>
