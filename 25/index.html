<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Lists </title>
    <style>
        nav ul li{
            list-style: devanagari;
            list-style-position: inside; /*This is to include the markers which is the numbers or circles, they are called as markers in our context*/
            background-color: pink;
            border: 2px solid purple;
            /* list-style-image: url(); This is for adding a image or gif in place of the marker*/
            /* list-style-type: ""; Can add emojis through this */
            /* list-style: disc inside url(); This is to consolidate 3 things inside a single line of code namely the marker + list+ marker + url */
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>Pricing</li>
            <li>Resources</li>
        </ul>
    </nav>
</body>
</html>
